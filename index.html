<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Lesson Studio</title><style>body{font:16px system-ui;max-width:740px;margin:60px auto;padding:20px;background:#f3f5f9;color:#18273a}main{background:white;padding:30px;border-radius:16px}input,select,button{font:inherit;padding:12px;margin:8px 0}input{width:90%}button{background:#194e85;color:white;border:0;border-radius:8px}pre{white-space:pre-wrap;font:inherit;line-height:1.6}</style><main><h1>Lesson Studio</h1><p>Create a draft instructional plan. Do not enter student information.</p><form><label>Topic<br><input id="topic" required maxlength="200" placeholder="Adding within 10"></label><br><label>Grade <select id="grade"><option>K</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><br><button>Generate draft</button></form><p id="mode" role="status"></p><pre id="result"></pre></main><script>document.querySelector('form').onsubmit=async e=>{e.preventDefault();const m=document.querySelector('#mode'),r=document.querySelector('#result');m.textContent='Generating…';r.textContent='';try{const res=await fetch('/lesson',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic:document.querySelector('#topic').value,grade:document.querySelector('#grade').value})});const d=await res.json();m.textContent=d.mode||'Error';r.textContent=d.lesson||d.error}catch{m.textContent='Connection failed'}};</script></html>
